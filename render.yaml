services:
  - type: web
    name: stockrescue-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stockrescue-db
          property: connectionString
      - key: QLOO_API_KEY
        sync: false
      - key: RETAILER_API_TOKEN_HASHES
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: stockrescue-db
    plan: free
    region: singapore
